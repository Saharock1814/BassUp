name: iOS CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Xcode project
      id: xcode
      run: |
        if [ -d BassUp.xcodeproj ] || [ -d BassUp.xcworkspace ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "Xcode project not in repo; skipping iOS build/test steps."
        fi

    - name: Select Xcode
      if: steps.xcode.outputs.present == 'true'
      run: sudo xcode-select -switch /Applications/Xcode_15.0.app

    - name: Setup Ruby
      if: steps.xcode.outputs.present == 'true'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Install CocoaPods
      if: steps.xcode.outputs.present == 'true'
      run: |
        sudo gem install cocoapods
        pod --version

    - name: Install SwiftLint
      if: steps.xcode.outputs.present == 'true'
      run: |
        brew install swiftlint
        swiftlint version

    - name: Install dependencies
      if: steps.xcode.outputs.present == 'true'
      run: pod install

    - name: Run SwiftLint
      if: steps.xcode.outputs.present == 'true'
      run: swiftlint lint --config .swiftlint.yml

    - name: Run unit tests
      if: steps.xcode.outputs.present == 'true'
      run: |
        xcodebuild test \
          -workspace BassUp.xcworkspace \
          -scheme BassUp \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
          -enableCodeCoverage YES \
          | xcpretty

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always() && steps.xcode.outputs.present == 'true'
      with:
        name: test-results
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
        if-no-files-found: ignore

    - name: Generate coverage report
      if: steps.xcode.outputs.present == 'true'
      run: |
        xcrun xccov view --report --files-for-target BassUp \
          ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult \
          > coverage.txt

    - name: Upload coverage report
      if: steps.xcode.outputs.present == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.txt
        if-no-files-found: ignore

  build:
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Xcode project
      id: xcode
      run: |
        if [ -d BassUp.xcodeproj ] || [ -d BassUp.xcworkspace ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "Xcode project not in repo; skipping iOS build steps."
        fi

    - name: Select Xcode
      if: steps.xcode.outputs.present == 'true'
      run: sudo xcode-select -switch /Applications/Xcode_15.0.app

    - name: Setup Ruby
      if: steps.xcode.outputs.present == 'true'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Install CocoaPods
      if: steps.xcode.outputs.present == 'true'
      run: sudo gem install cocoapods

    - name: Install dependencies
      if: steps.xcode.outputs.present == 'true'
      run: pod install

    - name: Build app
      if: steps.xcode.outputs.present == 'true'
      run: |
        xcodebuild archive \
          -workspace BassUp.xcworkspace \
          -scheme BassUp \
          -configuration Release \
          -archivePath builds/BassUp.xcarchive \
          -destination 'generic/platform=iOS'

    - name: Upload build artifacts
      if: steps.xcode.outputs.present == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-archive
        path: builds/BassUp.xcarchive
        if-no-files-found: ignore

  deploy-beta:
    runs-on: macos-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: beta

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_15.0.app

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Install Fastlane
      run: sudo gem install fastlane

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: app-archive
        path: builds/

    - name: Setup App Store Connect API
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8

    - name: Deploy to TestFlight
      env:
        FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      run: fastlane beta

  deploy-release:
    runs-on: macos-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_15.0.app

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Install Fastlane
      run: sudo gem install fastlane

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: app-archive
        path: builds/

    - name: Setup App Store Connect API
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8

    - name: Deploy to App Store
      env:
        FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      run: fastlane release
